services:
  pavlovarecipes:
    build: ./Frontend/
    networks: 
      - app-network
    environment:
      - VITE_API_BASE_URL=http://192.168.1.102:8000/app/
    ports: 
      - "14165:3000"
  pavlovackend:
    networks: 
      - app-network
    build: ./Backend/
    ports:
      - "8000:8000"

networks:
  app-network:
    driver: bridge